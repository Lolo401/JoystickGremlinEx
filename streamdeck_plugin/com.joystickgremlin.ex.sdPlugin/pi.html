<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8" />
  <title>JG Ex Button</title>
  <link rel="stylesheet" href="pi.css" />
</head>
<body>
  <div class="sdpi-wrapper">
    <div class="sdpi-item">
      <div class="sdpi-item-label">Button ID</div>
      <input class="sdpi-item-value" id="buttonId" type="text" value="" placeholder="e.g. Gear" />
    </div>
    <div class="sdpi-item">
      <div class="sdpi-item-label">Status</div>
      <div class="sdpi-item-value" id="status">Connecting…</div>
    </div>
    <div class="sdpi-item">
      <button class="sdpi-item-value" id="openConfig" type="button">Open Plugin Configuration</button>
    </div>
    <div class="sdpi-item">
      <details class="sdpi-item-value">
        <summary>Help</summary>
        <p><b>Button ID</b> is a name you choose (letters, digits, <code>-_.:</code> — no spaces).
        It must be unique on this deck. Joystick Gremlin Ex lists buttons alphabetically by this ID.
        Click <b>Refresh</b> in GEX after changes. Bridge host/port are under Plugin Configuration.</p>
      </details>
    </div>
  </div>
  <script src="pi.js"></script>
</body>
</html>
